<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio</title>
    <meta name="description" content="Resume and project portfolio" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      // Apply saved theme before paint to avoid a flash.
      try {
        const t = localStorage.getItem("theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="nav">
      <div class="nav-inner">
        <a class="brand" href="#top" id="brand"></a>
        <nav class="nav-links" aria-label="Sections">
          <a href="#about">About</a>
          <a href="#experience">Experience</a>
          <a href="#projects">Projects</a>
          <a href="#skills">Skills</a>
          <a href="#contact">Contact</a>
        </nav>
        <button class="theme-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section id="top" class="hero"></section>

      <section id="about" class="section">
        <div class="wrap" id="about-body"></div>
      </section>

      <section id="experience" class="section alt">
        <div class="wrap">
          <p class="eyebrow reveal">Experience</p>
          <h2 class="headline reveal">Where I've worked.</h2>
          <ol class="timeline" id="timeline"></ol>
          <h3 class="subhead reveal">Education</h3>
          <div class="edu-grid" id="education"></div>
        </div>
      </section>

      <section id="projects" class="section">
        <div class="wrap">
          <p class="eyebrow reveal">Projects</p>
          <h2 class="headline reveal">Things I've built.</h2>
          <div class="segmented reveal" id="project-filters" role="toolbar" aria-label="Filter projects by tag"></div>
          <div class="bento" id="project-grid"></div>
        </div>
      </section>

      <section id="skills" class="section alt">
        <div class="wrap">
          <p class="eyebrow reveal">Skills</p>
          <h2 class="headline reveal">The toolkit.</h2>
          <div class="skill-grid" id="skills-grid"></div>
        </div>
      </section>

      <section id="contact" class="section contact">
        <div class="wrap" id="contact-body"></div>
      </section>
    </main>

    <footer class="footer" id="footer"></footer>

    <dialog class="sheet" id="project-dialog" aria-labelledby="sheet-title">
      <button class="sheet-close" type="button" aria-label="Close" data-close>×</button>
      <div id="sheet-body"></div>
    </dialog>

    <script src="data/content.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
