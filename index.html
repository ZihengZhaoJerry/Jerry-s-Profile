<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile</title>
    <meta name="description" content="Resume and project portfolio" />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      // Apply saved theme before paint to avoid a flash.
      try {
        const t = localStorage.getItem("theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <nav class="container nav">
        <a class="brand" href="#profile" id="brand"></a>
        <div class="nav-links">
          <a href="#profile">Profile</a>
          <a href="#resume">Resume</a>
          <a href="#projects">Projects</a>
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">◐</button>
        </div>
      </nav>
    </header>

    <main class="container">
      <section id="profile" class="section profile"></section>

      <section id="resume" class="section">
        <h2 class="section-title">Resume</h2>
        <div class="resume-grid">
          <div>
            <div id="experience"></div>
            <div id="education"></div>
          </div>
          <aside>
            <div id="skills"></div>
            <div id="awards"></div>
          </aside>
        </div>
      </section>

      <section id="projects" class="section">
        <h2 class="section-title">Projects</h2>
        <div class="filters" id="project-filters" role="toolbar" aria-label="Filter projects by tag"></div>
        <div class="project-grid" id="project-grid"></div>
      </section>
    </main>

    <footer class="container footer" id="footer"></footer>

    <script src="data/content.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
